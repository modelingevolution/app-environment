name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Trusted Publishing: lets NuGet/login mint a 1-hour key
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/v}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Update version in csproj
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        sed -i "s/<Version>.*<\/Version>/<Version>$VERSION<\/Version>/" src/ModelingEvolution.AppEnvironment/ModelingEvolution.AppEnvironment.csproj

    - name: Restore
      run: dotnet restore src/ModelingEvolution.AppEnvironment/ModelingEvolution.AppEnvironment.csproj

    - name: Build
      run: dotnet build src/ModelingEvolution.AppEnvironment/ModelingEvolution.AppEnvironment.csproj --configuration Release --no-restore

    - name: Pack
      run: dotnet pack src/ModelingEvolution.AppEnvironment/ModelingEvolution.AppEnvironment.csproj --configuration Release --no-build --output ./nupkg

    - name: NuGet login (OIDC -> temporary API key)
      # nuget.org Trusted Publishing: no long-lived key. The policy on nuget.org names this repo and this workflow
      # file; `user` is the nuget.org username of the POLICY CREATOR (not the package owner / org).
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: rafal.maciag
    - name: Push to NuGet
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
